name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  support-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/support_matrix.py --check

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: yucca_core
        run: make -C components/yucca_core/test/host
      - name: input_bluepad32
        run: make -C components/input_bluepad32/test/host
      - name: target_wii
        run: make -C components/target_wii/test/host
      - name: yucca_app
        run: make -C components/yucca_app/test/host
      - name: WiimoteAnything
        run: make -C components/wiimote_anything/tests BTSTACK_ROOT=$GITHUB_WORKSPACE/external/bluepad32/external/btstack

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32
